# Each app is reachable ONLY from the VPS itself (127.0.0.1:8087 and :8088).
# Traefik forwards jc.centreespoir.ca and spp.centreespoir.ca to them.
#
# Two instances of the same image, two databases, sharing only what is in .env:
# the Twilio credentials and the Resend key for the notices to the Centre.
# `wps-spp` sits behind a compose profile, so it only starts once
# deploy/spp.enabled exists in the repository — see update.sh.
services:
  wps:
    build: .
    image: wps:latest
    container_name: wps
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8087:8080"
    volumes:
      - ./data:/data
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  # A bind mount whose directory does not exist yet is created by Docker as
  # root, and the image runs as the unprivileged `node` user — which then cannot
  # create its own database and crash-loops. This makes the directory writable
  # before the app starts, using the image already built rather than pulling
  # another one. It exits immediately and is idempotent.
  wps-spp-init:
    profiles: ["spp"]
    build: .
    image: wps:latest
    container_name: wps-spp-init
    user: "0:0"
    entrypoint: ["sh", "-c", "mkdir -p /data/uploads && chown -R node:node /data"]
    command: []
    restart: "no"
    volumes:
      - ./data-spp:/data

  # Système de Prévention de Pertes — the food-bank platform. Same image, same
  # Twilio account and sending number; everything else is overridden here so no
  # second secrets file has to be created on the server.
  wps-spp:
    profiles: ["spp"]
    depends_on:
      wps-spp-init:
        condition: service_completed_successfully
    build: .
    image: wps:latest
    container_name: wps-spp
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides the values .env sets for the church platform.
      - BRAND=spp
      - APP_URL=https://spp.centreespoir.ca
      # Empty on purpose: this instance generates and keeps its own cookie
      # secret in its own data directory rather than sharing one.
      - APP_SECRET=
      # Creates the first administrator on first boot only (see src/server.js).
      - ADMIN_PHONE=+18192085721
      - ADMIN_FIRST=David
      - ADMIN_LAST=Hatin
      - ADMIN_ORG=Centre Espoir de Gatineau
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./data-spp:/data
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
