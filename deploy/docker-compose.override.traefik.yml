# The override used on David's VPS (Traefik in container root-traefik-1, network root_default,
# certificate resolver "mytlschallenge"). Copy to /opt/wps/docker-compose.override.yml.
#
# update.sh keeps this in step automatically, so routing and domain changes ship
# by pushing to main.
#
# wps-spp answers on spp.centreespoir.ca, and on jc.centreespoir.ca too since
# the church platform was merged into it (2026-11-17): it redirects every old
# jc link to the same thing on spp (src/lib/legacy.js). The jc container still
# runs, with its data, but no address reaches it. To bring jc back, give the
# `wps` router its Host rule again and drop jc from the rule below.
services:
  wps:
    networks:
      - default
      - root_default
    labels:
      - traefik.enable=false
  wps-spp:
    networks:
      - default
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.wps-spp.rule=Host(`spp.centreespoir.ca`) || Host(`jc.centreespoir.ca`)
      - traefik.http.routers.wps-spp.entrypoints=websecure
      - traefik.http.routers.wps-spp.tls.certresolver=mytlschallenge
      - traefik.http.services.wps-spp.loadbalancer.server.port=8080
      # Server-sent events must not be buffered, or the live updates arrive late.
      - traefik.http.services.wps-spp.loadbalancer.responseforwarding.flushinterval=-1
networks:
  root_default:
    external: true
