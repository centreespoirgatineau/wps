# Nginx on the host → wps container on 127.0.0.1:8087. Replace DOMAIN.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Server-Sent Events (live chat): no buffering, long timeout
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection "";
    }
}
# After `certbot --nginx -d DOMAIN`, certbot adds the 443 block and the redirect.
