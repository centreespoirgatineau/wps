# Apache VirtualHost (a2enmod proxy proxy_http ssl headers). Replace DOMAIN.
<VirtualHost *:80>
    ServerName DOMAIN
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        / http://127.0.0.1:8087/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8087/
    ProxyTimeout 3600
</VirtualHost>
# Then: certbot --apache -d DOMAIN
